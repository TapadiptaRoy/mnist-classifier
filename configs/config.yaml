
# General settings
seed: 42


# Data settings

data:
  root: data            # folder where MNIST is downloaded
  batch_size: 64        # how many images the model sees at once
  val_size: 5000        # images taken from training data for validation
  num_workers: 2        # helper processes that load data in the background
  mean: [0.1307]        # average pixel value of MNIST (for normalization)
  std: [0.3081]         # spread of pixel values in MNIST (for normalization)


# model settings

model:
  conv1_channels: 32    # number of filters in the first Conv2d layer
  conv2_channels: 64    # number of filters in the second Conv2d layer
  hidden_units: 128     # size of the first Linear layer
  dropout: 0.25         # fraction of values switched off during training
  num_classes: 10       # number of possible answers (digits 0–9)



# Training settings

training:
  epochs: 5                                  # full passes through the training data
  learning_rate: 0.001                       # step size for the optimizer
  checkpoint_path: checkpoints/best_model.pt # where the best model is saved